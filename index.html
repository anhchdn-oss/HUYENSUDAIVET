<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Đại Việt Chiến Ký</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0604;color:#f6ead0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
#app{position:fixed;inset:0;margin:0 auto;max-width:480px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 70% at 50% 0,#5c3320 0,#2b170d 55%,#140a05 100%);box-shadow:0 0 40px #000}
#top{flex:none;padding:6px 8px 5px;background:linear-gradient(#2e180c,#1d0f07);border-bottom:2px solid #b8862b}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:#e8cf9a}
.who b{color:#f0c24d;font-size:13px;white-space:nowrap;max-width:36%;overflow:hidden;text-overflow:ellipsis}
.xp{flex:1;height:6px;background:#0007;border-radius:4px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#e5b445,#ff7a2a)}
.res{display:flex;gap:4px;margin-top:4px}
.res span{flex:1;min-width:0;background:#0006;border:1px solid #6a4526;border-radius:12px;padding:2px 4px;text-align:center;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:12px;-webkit-overflow-scrolling:touch}
#tabs{flex:none;display:flex;background:#1a0e07;border-top:2px solid #b8862b;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:6px 0 5px;font-size:11px;color:#bfa070;display:flex;flex-direction:column;align-items:center;gap:1px}
#tabs button i{font-style:normal;font-size:20px}
#tabs button.on{color:#ffd770;background:linear-gradient(#0000,#b8862b44)}
h3{font-size:15px;color:#f0c24d;margin:2px 0 6px}
.card{background:linear-gradient(#4d3020,#3a2417);border:1px solid #7a5230;border-radius:10px;padding:9px;margin:8px}
.card.gold{border-color:#e5b445;box-shadow:0 0 10px #e5b44544}
.sm{font-size:11px;color:#cfb68a}
.dim{color:#b99d72}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{background:linear-gradient(#f0c24d,#b8862b);color:#2a1505;border-radius:8px;padding:7px 11px;font-weight:800;border:1px solid #6a4210;white-space:nowrap}
.btn.red{background:linear-gradient(#e0553d,#9b1c1c);color:#fff;border-color:#4a0a0a}
.btn.gray{background:linear-gradient(#6a5a48,#47392b);color:#e8d9bd;border-color:#2a2018}
.btn.sm2{padding:4px 8px;font-size:12px}
.btn:disabled,.btn.off{opacity:.45;filter:grayscale(.6)}
.chips{display:flex;gap:6px;padding:8px 8px 0;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:14px;background:#0005;border:1px solid #6a4526;font-weight:700;font-size:12px;color:#d8c093;cursor:pointer}
.chip.on{background:linear-gradient(#f0c24d,#b8862b);color:#2a1505}
.bad{color:#ff8a7a}.ok{color:#8fe08f}
.scene{margin:8px;border-radius:10px;overflow:hidden;border:2px solid #b8862b;line-height:0}
.scene svg{width:100%;height:auto}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px}
.bgrid .card{margin:0;padding:7px}
.bic{font-size:24px}
.bar{height:6px;background:#0007;border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:#e5b445}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.hc{position:relative;background:linear-gradient(#4d3020,#33200f);border:2px solid #7a5230;border-radius:10px;padding:3px 3px 4px;text-align:center;overflow:hidden;cursor:pointer}
.hc.r1{border-color:#4da3ff}.hc.r2{border-color:#b46bff}.hc.r3{border-color:#ffb02e;box-shadow:0 0 8px #ffb02e55}.hc.r4{border-color:#ff4d4d;box-shadow:0 0 10px #ff4d4d88}
.hc.off .hcart{filter:brightness(0) opacity(.35)}
.hc.sel{outline:3px solid #fff}.hc.used{opacity:.55}
.hcart{height:78px;line-height:0}.hcart svg{height:100%;width:100%}
.hcn{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcm{font-size:10px;color:#d8c093}
.rb{display:inline-block;padding:0 4px;border-radius:4px;font-weight:900;color:#111;margin-right:2px;font-size:10px}
.rb.r0{background:#9ab}.rb.r1{background:#4da3ff}.rb.r2{background:#b46bff}.rb.r3{background:#ffb02e}.rb.r4{background:#ff5a5a}
.stars{color:#ffd24a;font-size:10px;letter-spacing:-1px;height:12px}
.formation{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:0 8px}
.fcell{position:relative;aspect-ratio:1/1.05;background:#0004;border:2px dashed #7a5230;border-radius:10px;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.fcell.hot{border-color:#fff;background:#fff2}
.fcell .fart{position:absolute;inset:0 0 14px 0;line-height:0}.fcell svg{width:100%;height:100%}
.fcell .fn{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:#000a;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcell .x{position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#b3271f;font-size:11px;line-height:20px;text-align:center;z-index:2}
.fcell .ln{position:absolute;left:3px;top:2px;font-size:9px;color:#bfa070;z-index:2}
#roster{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 8px;min-height:50px}
.ghost{position:fixed;z-index:200;width:70px;height:80px;pointer-events:none;opacity:.9;transform:translate(-50%,-60%)}
.ghost svg{width:100%;height:100%}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stg{display:flex;gap:8px;align-items:center}
.stn{width:34px;height:34px;border-radius:50%;background:#7a5230;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;border:2px solid #e5b445}
.stn.boss{background:#9b1c1c;border-color:#ff8a7a}.stn.done{background:#3a7a3a}.stn.lock{filter:grayscale(1);opacity:.5}
.modal{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.sheet{width:100%;max-height:100%;overflow-y:auto;overflow-x:hidden;background:linear-gradient(#4d3020,#2d1a0e);border:2px solid #e5b445;border-radius:14px;padding:12px}
.sheet h2{text-align:center;color:#f0c24d;margin-bottom:8px;font-size:18px}
.big{height:150px;line-height:0;text-align:center}.big svg{height:100%}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:12px;margin:6px 0}
.kv div{background:#0004;border-radius:6px;padding:3px 5px}
.eq{display:flex;align-items:center;gap:6px;background:#0004;border-radius:8px;padding:5px;margin-top:4px}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000d;border:1px solid #e5b445;padding:8px 14px;border-radius:20px;z-index:300;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#login{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:radial-gradient(90% 60% at 50% 30%,#7a3a1a 0,#2b130a 60%,#0d0604 100%)}
#login h1{font-size:30px;letter-spacing:1px;background:linear-gradient(#fff2b0,#e5b445 50%,#a8601a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:6px;text-shadow:none}
#login p{color:#e8cf9a;letter-spacing:3px;font-size:12px;margin:4px 0 14px}
#login input{width:80%;padding:10px;border-radius:8px;border:2px solid #b8862b;background:#1a0e07;color:#f6ead0;text-align:center;margin-bottom:10px}
.spin{animation:rot 40s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
/* battle */
#battle{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:linear-gradient(#1b2a33,#2a1d12 45%,#3a2514)}
.bt-top{flex:none;display:flex;align-items:center;gap:5px;padding:6px 8px;background:#000a;border-bottom:2px solid #b8862b}
.bt-top .t{flex:1;font-size:12px;font-weight:700;color:#f0c24d;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-top button{padding:4px 8px;border-radius:6px;background:#4a3320;border:1px solid #8a6034;font-weight:800;font-size:12px}
.bt-top button.on{background:#f0c24d;color:#2a1505}
.bt-field{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:4px 8px;gap:2px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px}
.cell{position:relative;min-height:0;border-radius:8px;background:#ffffff0a}
.cell .spr{position:absolute;left:0;right:0;top:8px;bottom:11px;line-height:0}
.cell .spr svg{width:100%;height:100%;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px) scale(1.015)}}
.cell .nm{position:absolute;left:2px;top:0;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;z-index:2;max-width:100%;white-space:nowrap;overflow:hidden}
.cell.e .nm{color:#ffb0a0}.cell.boss .spr{transform:scale(1.12)}
.cell .bars{position:absolute;left:3px;right:3px;bottom:0;height:9px;z-index:2}
.bars i{display:block;height:5px;border-radius:2px;background:#d33;width:100%;transform-origin:left;border:1px solid #000}
.bars b{display:block;height:3px;margin-top:1px;border-radius:2px;background:#e5b445;width:0;transition:width .15s}
.cell.p .bars i{background:#3cc86a}
.cell.dead .spr{opacity:.12;filter:grayscale(1)}.cell.dead .bars,.cell.dead .nm{opacity:.2}
.cell.ready .spr{filter:drop-shadow(0 0 6px #ffd24a)}
.cell.ready::after{content:"✦ TUYỆT KỸ";position:absolute;left:0;right:0;top:-1px;text-align:center;font-size:9px;color:#ffd24a;font-weight:900;z-index:4;animation:bob .6s infinite}
.cell.stun::before{content:"💫";position:absolute;top:2px;right:2px;font-size:14px;z-index:4}
.fnum{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-weight:900;font-size:16px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 2px 0 #000;z-index:9;pointer-events:none;white-space:nowrap}
.fnum.crit{color:#ffd24a;font-size:21px}.fnum.heal{color:#6dff8e}.fnum.miss{color:#9cf;font-size:13px}.fnum.thorn{color:#f9a}
.fx{position:absolute;inset:-12%;pointer-events:none;z-index:6;border-radius:50%}
.fx-fire{background:radial-gradient(circle,#fff8 0,#ff9a2add 35%,#ff3a0000 72%);animation:fxp .6s ease-out forwards}
.fx-water{background:radial-gradient(circle,#d8f8ffcc 0,#2fb3ffaa 40%,#0000 72%);animation:fxp .6s ease-out forwards}
.fx-holy{background:radial-gradient(circle,#fff 0,#ffe27acc 35%,#0000 72%);animation:fxp .7s ease-out forwards}
.fx-wind{background:radial-gradient(circle,#0000 40%,#d8ffe0aa 55%,#0000 72%);animation:fxp .5s ease-out forwards}
.fx-quake{border:6px solid #c8944a;background:#8a5a2a44;animation:fxp .6s ease-out forwards}
.fx-slash{border-radius:0;background:linear-gradient(135deg,#0000 42%,#fff 48%,#9cf 52%,#0000 58%);animation:fxs .35s ease-out forwards}
.fx-thunder{border-radius:0;background:repeating-linear-gradient(110deg,#0000 0 9px,#fff7a8 9px 12px);animation:fxs .4s forwards}
.fx-arrows{border-radius:0;background:repeating-linear-gradient(80deg,#0000 0 7px,#ffe9a0 7px 9px);animation:fxs .45s ease-out forwards}
@keyframes fxp{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:scale(1.4);opacity:0}}
@keyframes fxs{0%{transform:translate(-20%,-20%);opacity:0}30%{opacity:1}100%{transform:translate(15%,15%);opacity:0}}
#bt-mid{flex:none;text-align:center;font-weight:900;color:#e5b445;font-size:12px;height:20px;line-height:20px;letter-spacing:2px}
#bt-banner{position:absolute;left:0;right:0;top:46%;text-align:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 8px #000,0 2px 0 #b3271f;z-index:20;pointer-events:none;opacity:0;white-space:nowrap}
#bt-flash{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0}
.proj{position:absolute;width:20px;height:3px;background:linear-gradient(90deg,#0000,#ffe9a0);border-radius:2px;z-index:8;pointer-events:none}
.bt-foot{flex:none;padding:4px 8px;font-size:11px;text-align:center;color:#cfb68a;background:#0008;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.mc{height:54px;background:#0004;border-radius:6px;line-height:0;position:relative;overflow:hidden}
.mc svg{width:100%;height:100%}.mc.x{opacity:.25}
.aura{transform-box:fill-box;transform-origin:center;animation:aur 2.4s ease-in-out infinite}@keyframes aur{50%{transform:scale(1.08);opacity:.3}}
.lvl{font-size:22px;font-weight:900;text-align:center;margin:4px 0}
.win{color:#ffd24a}.lose{color:#ff8a7a}
.fxl{position:absolute;pointer-events:none;z-index:12}
.fxl svg{width:100%;height:100%;overflow:visible}
.fxl .a{animation-duration:var(--d,800ms);animation-fill-mode:both;animation-timing-function:ease-out;transform-box:fill-box;transform-origin:center}
@keyframes kPop{0%{transform:scale(.1);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1.7);opacity:0}}
@keyframes kRing{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.6);opacity:0}}
@keyframes kRise{0%{transform:translate(var(--x,0px),12px) scale(.3);opacity:0}25%{opacity:1}100%{transform:translate(var(--x,0px),-46px) scale(1.1);opacity:0}}
@keyframes kRock{0%{transform:translate(var(--x,0px),10px) rotate(0);opacity:0}30%{transform:translate(var(--x,0px),-38px) rotate(120deg);opacity:1}100%{transform:translate(calc(var(--x,0px)*1.4),26px) rotate(300deg);opacity:0}}
@keyframes kSpin{0%{transform:rotate(0) scale(.2);opacity:0}30%{opacity:1}100%{transform:rotate(var(--r,360deg)) scale(1.4);opacity:0}}
@keyframes kSlash{0%{stroke-dashoffset:100;opacity:1}55%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes kFly{0%{transform:translate(0,0) scale(1.2);opacity:1}100%{transform:translate(var(--x,0px),var(--y,0px)) scale(.2);opacity:0}}
@keyframes kArrow{0%{transform:translate(-50px,-70px);opacity:0}20%{opacity:1}70%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:0}}
#bt-glyph{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:120px;font-weight:900;opacity:0;z-index:10;pointer-events:none;text-shadow:0 0 20px currentColor}
.elb{position:absolute;right:2px;top:9px;width:17px;height:17px;border-radius:50%;font-size:10px;line-height:15px;font-weight:900;color:#111;text-align:center;border:1px solid #000;z-index:3}
.fcell .elb{top:auto;bottom:16px;right:3px}.hc .elb{left:3px;right:auto;top:3px}.hc .zob{position:absolute;right:3px;top:2px;font-size:14px;z-index:3}
.mc .elb{top:1px;right:1px;width:14px;height:14px;font-size:9px;line-height:12px}
.cell.th{box-shadow:inset 0 0 0 2px #ffd24acc,0 0 8px #ffd24a66}
.thx{font-size:10px;color:#ffd24a;letter-spacing:0}.thx.e{color:#ff9a8a}
.fnum.adv{color:#ffb040}.fnum.weak{color:#9ab;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="gFire"><stop offset="0" stop-color="#fff6c0"/><stop offset=".4" stop-color="#ff9a2a"/><stop offset="1" stop-color="#ff3a0000"/></radialGradient>
  <radialGradient id="gWater"><stop offset="0" stop-color="#e8fbff"/><stop offset=".45" stop-color="#3ab8ff"/><stop offset="1" stop-color="#1060ff00"/></radialGradient>
  <radialGradient id="gWood"><stop offset="0" stop-color="#eaffd0"/><stop offset=".45" stop-color="#4ccf4a"/><stop offset="1" stop-color="#10802000"/></radialGradient>
  <radialGradient id="gMetal"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#f0e6b8"/><stop offset="1" stop-color="#bfa86000"/></radialGradient>
  <radialGradient id="gEarth"><stop offset="0" stop-color="#f6e2b8"/><stop offset=".45" stop-color="#c8944a"/><stop offset="1" stop-color="#6a3a1000"/></radialGradient>
  <radialGradient id="gHoly"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffc03000"/></radialGradient>
  <radialGradient id="gWind"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#b8ffd0"/><stop offset="1" stop-color="#40c88000"/></radialGradient>
  </defs></svg>
  <div id="top"></div>
  <div id="main"></div>
  <div id="tabs"></div>
  <div id="battle">
    <div class="bt-top"><div class="t" id="bt-title"></div><button data-spd="1" class="on">x1</button><button data-spd="2">x2</button><button data-spd="3">x3</button><button id="bt-auto">AUTO</button><button id="bt-quit">Rút lui</button></div>
    <div class="bt-field"><div class="grid" id="bt-e"></div><div id="bt-mid"><span id="bt-the" class="thx e"></span> ⚔ <span id="bt-time"></span> ⚔ <span id="bt-thp" class="thx"></span></div><div class="grid" id="bt-p"></div><div id="bt-banner"></div><div id="bt-glyph"></div><div id="bt-flash"></div></div>
    <div class="bt-foot" id="bt-foot"></div>
  </div>
  <div id="login"></div>
  <div id="toast"></div>
</div>

<script id="core">
'use strict';
/* ===================== DỮ LIỆU ===================== */
const RN=['N','R','SR','SSR','UR'], RMUL=[1,1.2,1.5,1.9,2.4];
const TYPES={
 thuan:{n:'Thuẫn binh',ic:'🛡️',hp:1.3,atk:.7,def:1.4,spd:80,d:'Phòng thủ, bảo vệ đồng đội.'},
 thuong:{n:'Thương binh',ic:'🔱',hp:1,atk:1,def:1,spd:95,d:'Cân bằng, bền bỉ nơi tiền tuyến.'},
 dao:{n:'Đao binh',ic:'⚔️',hp:1,atk:1.15,def:.9,spd:100,d:'Cận chiến gây sát thương cao.'},
 cung:{n:'Cung nỏ binh',ic:'🏹',hp:.75,atk:1.2,def:.6,spd:105,d:'Tầm xa, tập trung mục tiêu yếu máu.'},
 ky:{n:'Kỵ binh',ic:'🐎',hp:1,atk:1.1,def:.8,spd:125,d:'Xung phong thẳng vào hàng sau.'},
 tuong:{n:'Tượng binh',ic:'🐘',hp:1.5,atk:1,def:1.1,spd:70,d:'Công phá, đòn thường lan sang mục tiêu kề cạnh.'},
 cong:{n:'Công thành binh',ic:'🪵',hp:1.1,atk:1.25,def:.9,spd:75,d:'Phá thành: +30% sát thương lên boss.'},
 muu:{n:'Mưu sĩ',ic:'📜',hp:.8,atk:.8,def:.7,spd:98,d:'Hỗ trợ, tăng sức mạnh, khống chế.'}
};
/* ===== NGŨ HÀNH · 12 CON GIÁP · TAM HỢP ===== */
const EL=[{n:'Kim',h:'金',c:'#f0e6b8'},{n:'Mộc',h:'木',c:'#5fd45a'},{n:'Thủy',h:'水',c:'#4db8ff'},{n:'Hỏa',h:'火',c:'#ff6a3a'},{n:'Thổ',h:'土',c:'#d8a458'}];
const KHAC={0:1,1:4,4:2,2:3,3:0}, SINH={0:2,2:1,1:3,3:4,4:0};
function elMul(a,d){if(KHAC[a]===d)return 1.3;if(KHAC[d]===a)return .8;return 1}

<script id="ui">
'use strict';

 return `<svg viewBox="-60 -60 120 120" width="${sz}" height="${sz}"><circle r="58" fill="#6a3d17"/><circle r="55" fill="none" stroke="#e8c05a" stroke-width="2"/><circle r="50" fill="#8a5424"/>${r}<circle r="16" fill="#e8c05a"/><circle r="10" fill="#8a5424"/><circle r="5" fill="#e8c05a"/>${[28,52].map(x=>`<circle r="${x}" fill="none" stroke="#e8c05a" stroke-width=".8" stroke-dasharray="2 3"/>`).join('')}</svg>`}

 if(DR.g){DR.g.style.left=e.clientX+'px';DR.g.style.top=e.clientY+'px';$$('.fcell').forEach(c=>c.classList.remove('hot'));const u=document.elementFromPoint(e.clientX,e.clientY),c=u&&u.closest('[data-cell]');if(c)c.classList.add('hot')}});

 if(!d.moved||cancel)return;lastDrag=Date.now();const u=document.elementFromPoint(e.clientX,e.clientY),cell=u&&u.closest('[data-cell]'),id=d.hid;

 else html+=`<div class="card" style="margin:8px 0">Chưa sở hữu – chiêu mộ hoặc nhận qua chiến dịch.</div>`;
 if(r)html+=menhCard(id);
 html+=`<div class="card" style="margin:8px 0"><b>⚡ ${h.sk.n}</b><div class="sm">${h.sk.d}</div><b>✦ Nội tại</b><div class="sm">${h.ps.d}</div></div><div class="sm" style="margin-bottom:8px">${h.bio}</div>`;
 if(r){const nm=[['Vũ khí','🗡️','Công'],['Giáp','🥋','Máu · Thủ'],['Bùa hộ mệnh','📿','Máu · Bạo kích']],cp=eqCap();
  html+='<b>Trang bị</b>'+nm.map((q,i)=>{const l=r.eq[i],c=eqCost(l);return `<div class="eq"><span class="bic">${q[1]}</span><div class="grow"><b>${q[0]}</b> Lv.${l}<div class="sm">${q[2]}</div></div><button class="btn sm2 ${l>=cp?'off':''}" data-a="eq" data-id="${id}" data-sl="${i}">${l>=cp?'Tối đa':'Rèn '+rtxt(c)}</button></div>`}).join('')}
 html+=`<div class="row" style="margin-top:10px">${r?`<button class="btn grow" data-a="team" data-id="${id}">${S.team.includes(id)?'Rút khỏi đội':'Đưa vào đội'}</button>`:''}<button class="btn gray grow" data-a="close">Đóng</button></div>`;

/* ---------- chiêu mộ ---------- */
function pull1(minR){S.pity++;let r;if(S.pity>=90)r=4;else{const x=Math.random()*100;r=x<3?4:x<12?3:x<32?2:x<62?1:0}if(r<minR)r=minR;if(r===4)S.pity=0;return pick(HER.filter(h=>h.r===r)).id}
function openRecruit(res){
 let h=`<h2>🎴 Chiêu Mộ Danh Tướng</h2><div class="card" style="margin:0 0 8px"><div class="sm">N 38% · R 30% · SR 20% · SSR 9% · UR 3%. Bảo đảm UR sau 90 lượt (còn ${90-S.pity}). Mười lượt luôn có ít nhất SR. Tướng trùng cho mảnh để tăng sao.</div></div>`;
 if(res)h+=`<div class="hgrid" style="padding:0 0 8px">${res.map(x=>hcard(x.id,'').replace('hc r','hc r')+(x.dup?'':'')).join('')}</div><div class="sm" style="text-align:center">${res.map(x=>x.dup?'':`✨ ${HM[x.id].n}`).filter(Boolean).join(' · ')||'Toàn tướng trùng → nhận mảnh tướng.'}</div>`;
 h+=`<div class="row" style="margin-top:8px"><button class="btn grow ${S.res.gem<100?'off':''}" data-a="pull" data-n="1">1 lượt<br>💎100</button><button class="btn red grow ${S.res.gem<900?'off':''}" data-a="pull" data-n="10">10 lượt<br>💎900</button></div><button class="btn gray" style="width:100%;margin-top:8px" data-a="close">Đóng</button>`;
 modal('rec',h);
}
function doRecruit(n){const cost=n===10?900:100;if(S.res.gem<cost)return toast('Không đủ 💎');S.res.gem-=cost;const res=[];
 for(let i=0;i<n;i++){const id=pull1(n===10&&i===9&&!res.some(x=>HM[x.id].r>=2)?2:0);let dup=false;if(S.heroes[id]){S.heroes[id].shards++;dup=true}else S.heroes[id]=mkRec();res.push({id,dup})}
 S.stat.pulls+=n;bump('rec');save();updTop();openRecruit(res);render();}

function mini(us,side){const rows=side?[2,1,0]:[0,1,2];let h='<div class="mg">';rows.forEach(r=>{for(let c=0;c<3;c++){const u=us.find(x=>x.pos===r*3+c);h+=`<div class="mc ${u?'':'x'}">${u?ART.svg(u.art,u.key)+elb(u.el):''}</div>`}});return h+'</div>'}
function preBattle(ctx){
 const pu=playerUnits(ctx.allow),eu=enemyUnits(ctx.enemies,ctx.L,ctx.seed),ex=S.team.filter(id=>id&&ctx.allow&&!ctx.allow.includes(HM[id].era));

function startCamp(r,s){const d=stageDef(r,s),R=REGIONS[r];preBattle({mode:'camp',seed:r*1000+s*7+13,reg:r,s,g:d.g,boss:d.boss,title:`${R.n} · Màn ${s+1}`,sub:d.name+(d.boss?' — BOSS':''),enemies:d.enemies,L:d.L,allow:R.allow})}
function startHunt(b){const hb=HUNT.find(x=>x[0]===b),R=REGIONS[hb[1]],g=hb[1]*10+hb[2],L=1+g*1.5+4;const pool=R.pool,en=[{tpl:b,boss:true,pos:1},{tpl:pool[0],pos:0},{tpl:pool[1%pool.length],pos:2}];
 preBattle({mode:'hunt',seed:g*31+5,g,boss:true,title:'Thảo phạt '+EM[b].n,sub:`Còn ${S.hunt.left} lượt hôm nay`,enemies:en,L,allow:R.allow,bossId:b})}
function startTower(){const f=S.tower+1,pool=['quy_binh','lang_yeu','thuy_quai','an_binh','an_cung','an_ky','tan_binh','tan_cung','tan_ky','tan_cong'],bosses=['moc_tinh','ho_tinh','ngu_tinh','thuy_tinh','an_tuong','do_thu','trieu_da'],bs=f%5===0;
 const n=Math.min(5,2+Math.floor(f/3)),list=[];const used=new Set();const add=(tpl,boss,pf)=>{const p=pf.find(x=>!used.has(x));used.add(p);list.push({tpl,boss,pos:p})};
 if(bs)add(bosses[(f/5-1)%bosses.length|0],true,[1,4,7]);for(let i=0;i<n-(bs?1:0);i++){const t=pool[(f*3+i*2)%pool.length];add(t,false,RANGED[EM[t].t]?[7,6,8,4,3,5]:[1,0,2,4,3,5])}
 preBattle({mode:'tower',seed:f*17+3,f,g:f,boss:bs,title:`Tháp lịch sử · Tầng ${f}`,sub:'Chế độ giả tưởng – dùng mọi tướng',enemies:list,L:3+f*1.4,allow:null})}

const BT={b:null,run:false,speed:1,ctx:null,last:0,acc:0,cell:{}};
function launch(){
 const ctx=PEND;if(!ctx)return;
 if(ctx.mode==='hunt'){if(S.hunt.left<=0)return toast('Hết lượt');S.hunt.left--}
 closeM();
 const pu=playerUnits(ctx.allow),eu=enemyUnits(ctx.enemies,ctx.L,ctx.seed);if(!pu.length)return toast('Chưa có tướng nào hợp lệ');
 BT.ctx=ctx;BT.b=makeBattle(pu,eu);BT.b.manual=!S.auto;BT.speed=S.speed||1;BT.run=true;BT.acc=0;BT.last=performance.now();
 $('#battle').style.display='flex';$('#bt-title').textContent=ctx.title+(ctx.sub?' · '+ctx.sub:'');
 buildBattle();markTH();setSpeed(BT.speed);setAutoBtn();requestAnimationFrame(loop);
}
function buildBattle(){
 [0,1].forEach(side=>{const g=$(side?'#bt-e':'#bt-p');g.innerHTML='';const order=side?[6,7,8,3,4,5,0,1,2]:[0,1,2,3,4,5,6,7,8];
  order.forEach(pos=>{const c=document.createElement('div');c.className='cell '+(side?'e':'p');c.dataset.pos=pos;c.dataset.side=side;g.appendChild(c);BT.cell[side+'_'+pos]=c})});
 BT.b.units.forEach(u=>{const c=BT.cell[u.side+'_'+u.pos];u.cell=c;if(u.boss)c.classList.add('boss');c.innerHTML=`<div class="nm">${u.boss?'👑':''}${ZO[u.zo].ic}${u.name}</div>${elb(u.el)}<div class="spr">${ART.svg(u.art,u.key)}</div><div class="bars"><i></i><b></b></div>`;c.querySelector('svg').style.animationDelay=(-Math.random()*2)+'s'});
 $('#bt-foot').textContent=S.auto?'Tự động tung tuyệt kỹ. Bấm AUTO để chuyển sang thủ công.':'Thủ công: chạm vào tướng có “✦ TUYỆT KỸ” để tung chiêu.';
}
function setSpeed(n){BT.speed=n;S.speed=n;$$('[data-spd]').forEach(b=>b.classList.toggle('on',+b.dataset.spd===n))}
function setAutoBtn(){$('#bt-auto').classList.toggle('on',S.auto)}
$$('[data-spd]').forEach(b=>b.addEventListener('click',()=>setSpeed(+b.dataset.spd)));
$('#bt-auto').addEventListener('click',()=>{S.auto=!S.auto;if(BT.b)BT.b.manual=!S.auto;setAutoBtn();save();$('#bt-foot').textContent=S.auto?'Tự động tung tuyệt kỹ.':'Thủ công: chạm vào tướng có “✦ TUYỆT KỸ” để tung chiêu.'});
$('#bt-quit').addEventListener('click',()=>{if(BT.b&&!BT.b.over){BT.b.over=true;BT.b.win=false;BT.quit=true}});
$('#bt-p').addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c||!BT.b||BT.b.over||!BT.b.manual)return;const u=BT.b.units.find(x=>x.side===0&&x.alive&&x.cell===c);if(u&&u.rage>=100&&!hasSt(u,'stun')){cast(BT.b,u,HK);chk(BT.b)}});
function loop(ts){
 if(!BT.run)return;const dt=Math.min(.1,(ts-BT.last)/1000);BT.last=ts;BT.acc+=dt*BT.speed;
 while(BT.acc>=.05&&!BT.b.over){step(BT.b,.05,HK);BT.acc-=.05}
 updBars();$('#bt-time').textContent=Math.floor(BT.b.t)+'s';
 if(BT.b.over){BT.run=false;setTimeout(()=>endBattle(BT.b.win),BT.quit?0:700);return}
 requestAnimationFrame(loop);
}
function updBars(){BT.b.units.forEach(u=>{const c=u.cell;if(!c)return;const bars=c.querySelector('.bars');bars.firstChild.style.transform=`scaleX(${Math.max(0,u.hp/u.maxHp)})`;bars.lastChild.style.width=Math.min(100,u.rage)+'%';c.classList.toggle('dead',!u.alive);c.classList.toggle('stun',u.alive&&hasSt(u,'stun'));c.classList.toggle('ready',u.alive&&u.side===0&&BT.b.manual&&u.rage>=100)})}

  for(let i=0;i<8;i++){const a=rr(0,6.28);h+=`<path ${A_('kFly',`--x:${(Math.cos(a)*34).toFixed(1)}px;--y:${(Math.sin(a)*34).toFixed(1)}px;`,.15)} d="${STAR}" fill="#fff"/>`}return h},

  for(let i=0;i<7;i++)h+=G(rr(-22,22),rr(2,14),`<path ${A_('kRock',`--x:${rr(-12,12).toFixed(1)}px;`,rr(0,.3))} d="M-5 3L-3-4L4-5L6 2L1 5Z" fill="${pick(['#8a6a3a','#a8844a','#6a4a22'])}" stroke="#2a1505" stroke-width="1"/>`);return h},

};
function fxAt(el,html,size,dur){if(!el)return;const f=$('.bt-field').getBoundingClientRect(),r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*size,d=document.createElement('div');d.className='fxl';d.style.cssText=`left:${r.left-f.left+r.width/2-s/2}px;top:${r.top-f.top+r.height/2-s/2}px;width:${s}px;height:${s}px;--d:${dur/BT.speed}ms`;d.innerHTML=`<svg viewBox="-50 -50 100 100">${html}</svg>`;$('.bt-field').appendChild(d);setTimeout(()=>d.remove(),dur/BT.speed+120)}
function spark(t,col,crit){let h=`<circle ${A_('kPop')} r="${crit?24:15}" fill="${col}" fill-opacity=".55"/><path ${A_('kPop')} d="${STARB}" fill="#fff"/>`;for(let i=0;i<5;i++){const a=rr(0,6.28);h+=`<path ${A_('kFly',`--x:${(Math.cos(a)*30).toFixed(1)}px;--y:${(Math.sin(a)*30).toFixed(1)}px;`)} d="${STAR}" fill="${col}"/>`}fxAt(t.cell,h,1.1,480)}
function burst(col,gl){return `<circle ${A_('kRing')} r="14" fill="none" stroke="${col}" stroke-width="4"/><circle ${A_('kPop')} r="22" fill="${col}" fill-opacity=".35"/><text ${A_('kPop')} text-anchor="middle" y="12" font-size="34" font-weight="900" fill="#fff" stroke="${col}" stroke-width="1.5">${gl}</text>`}
function fnum(u,txt,cls){const c=u.cell;if(!c)return;const n=document.createElement('div');n.className='fnum '+(cls||'');n.textContent=txt;n.style.marginLeft=((Math.random()*30)-15)+'px';c.appendChild(n);anim(n,[{transform:'translate(-50%,0) scale(.6)',opacity:0},{transform:'translate(-50%,-14px) scale(1.15)',opacity:1,offset:.2},{transform:'translate(-50%,-42px) scale(1)',opacity:0}],{duration:900/BT.speed});setTimeout(()=>n.remove(),900/BT.speed+20)}
function lunge(u,t){if(!u.cell||!t.cell)return;const a=u.cell.getBoundingClientRect(),b=t.cell.getBoundingClientRect(),dx=(b.left-a.left)*.4,dy=(b.top-a.top)*.4;anim(u.cell.querySelector('.spr'),[{transform:'none'},{transform:`translate(${dx}px,${dy}px) scale(1.15)`,offset:.4},{transform:'none'}],{duration:380/BT.speed,easing:'ease-out'})}
function proj(u,t){const f=$('.bt-field').getBoundingClientRect(),a=u.cell.getBoundingClientRect(),b=t.cell.getBoundingClientRect(),x1=a.left-f.left+a.width/2,y1=a.top-f.top+a.height/2,x2=b.left-f.left+b.width/2,y2=b.top-f.top+b.height/2,ang=Math.atan2(y2-y1,x2-x1),p=document.createElement('div'),col=EL[u.el].c;p.className='proj';p.style.cssText=`left:${x1}px;top:${y1}px;background:linear-gradient(90deg,#0000,${col});box-shadow:0 0 6px ${col}`;$('.bt-field').appendChild(p);anim(p,[{transform:`translate(0,0) rotate(${ang}rad)`},{transform:`translate(${x2-x1}px,${y2-y1}px) rotate(${ang}rad)`}],{duration:260/BT.speed});setTimeout(()=>p.remove(),270/BT.speed+20)}
function orb(u,t,col){const f=$('.bt-field').getBoundingClientRect(),a=u.cell.getBoundingClientRect(),b=t.cell.getBoundingClientRect(),x1=a.left-f.left+a.width/2,y1=a.top-f.top+a.height/2,x2=b.left-f.left+b.width/2,y2=b.top-f.top+b.height/2,p=document.createElement('div');p.style.cssText=`position:absolute;left:${x1-11}px;top:${y1-11}px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff,${col} 55%,#0000 72%);box-shadow:0 0 14px ${col};z-index:13;pointer-events:none`;$('.bt-field').appendChild(p);anim(p,[{transform:'translate(0,0) scale(.6)'},{transform:`translate(${x2-x1}px,${y2-y1}px) scale(1.3)`}],{duration:240/BT.speed,easing:'ease-in'});setTimeout(()=>p.remove(),260/BT.speed)}
function sweep(u,sk,tg){if(!tg.length||sk.t==='single'||sk.t==='rand')return;const col=EL[u.el].c,f=$('.bt-field').getBoundingClientRect();let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;tg.forEach(t=>{if(!t.cell)return;const r=t.cell.getBoundingClientRect();x1=Math.min(x1,r.left);y1=Math.min(y1,r.top);x2=Math.max(x2,r.right);y2=Math.max(y2,r.bottom)});if(x1>x2)return;
 const box=document.createElement('div'),band=document.createElement('div'),vert=sk.t==='col';box.className='fxl';box.style.cssText=`left:${x1-f.left}px;top:${y1-f.top}px;width:${x2-x1}px;height:${y2-y1}px;overflow:hidden;z-index:11`;
 band.style.cssText=vert?`position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(#0000,${col}cc,#fff8,${col}cc,#0000)`:`position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(90deg,#0000,${col}cc,#fff8,${col}cc,#0000)`;
 box.appendChild(band);$('.bt-field').appendChild(box);anim(band,vert?[{transform:'translateY(-110%)'},{transform:'translateY(230%)'}]:[{transform:'translateX(-110%)'},{transform:'translateX(230%)'}],{duration:520/BT.speed,easing:'ease-in'});setTimeout(()=>box.remove(),620/BT.speed)}
function bannerMsg(txt,col,ms){const bn=$('#bt-banner');bn.textContent=txt;bn.style.color=col;anim(bn,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1.08)',offset:.2},{opacity:1,transform:'scale(1)',offset:.75},{opacity:0,transform:'scale(1)'}],{duration:(ms||1000)/BT.speed})}
function markTH(){const b=BT.b;[0,1].forEach(side=>{const t=b.th[side];if(t)b.units.filter(u=>u.side===side&&t.zs.includes(u.zo)).forEach(u=>u.cell&&u.cell.classList.add('th'))});
 $('#bt-thp').textContent=b.th[0]?`🔰 Tam hợp ${b.th[0].n}/3`:'';$('#bt-the').textContent=b.th[1]?`Địch ⚠ ${b.th[1].n}/3`:'';
 if(b.th[0])bannerMsg('🔰 '+thTxt(b.th[0]),'#ffd24a',1500);if(b.th[1])setTimeout(()=>bannerMsg('⚠ Địch '+thTxt(b.th[1]),'#ff9a8a',1500),b.th[0]?1600/BT.speed:300)}
const HK={
 basic(u,t){if(!u.cell)return;if(RANGED[u.type]){anim(u.cell.querySelector('.spr'),[{transform:'none'},{transform:'scale(1.12) translateY(-3px)'},{transform:'none'}],{duration:260/BT.speed});proj(u,t)}else lunge(u,t)},
 dmg(u,d,o){if(!u.cell)return;const up=o.adv>1.05?'▲':o.adv<.95?'▼':'';fnum(u,(o.crit?'💥':'')+d+up,o.thorn?'thorn':o.crit?'crit':up==='▲'?'adv':up==='▼'?'weak':'');anim(u.cell.querySelector('.spr'),[{filter:'brightness(2.2)'},{filter:'none'}],{duration:260/BT.speed});if(!o.thorn&&o.from)spark(u,EL[o.from.el].c,o.crit)},
 heal(u,a){fnum(u,'+'+a,'heal')},miss(u){fnum(u,'Né!','miss')},
 die(u){if(u.cell)u.cell.classList.add('dead')},
 skill(u,sk,tg,dmg,sup){const el=EL[u.el],col=el.c;
  bannerMsg(`${el.h} ${u.name}: ${sk.n}`,u.side?'#ffb0a0':'#ffe9a0');
  const gl=$('#bt-glyph');gl.textContent=el.h;gl.style.color=col;anim(gl,[{opacity:0,transform:'scale(.5)'},{opacity:.55,transform:'scale(1)',offset:.25},{opacity:0,transform:'scale(1.3)'}],{duration:900/BT.speed});
  const fl=$('#bt-flash');fl.style.background=`radial-gradient(circle,${col}88,#0000 70%)`;anim(fl,[{opacity:0},{opacity:1,offset:.2},{opacity:0}],{duration:500/BT.speed});
  anim($('.bt-field'),[{transform:'translate(0,0)'},{transform:'translate(4px,-3px)'},{transform:'translate(-4px,3px)'},{transform:'translate(0,0)'}],{duration:350/BT.speed});
  if(u.cell){anim(u.cell.querySelector('.spr'),[{transform:'none',filter:'brightness(1)'},{transform:'scale(1.3)',filter:'brightness(1.8)',offset:.3},{transform:'none',filter:'brightness(1)'}],{duration:600/BT.speed});fxAt(u.cell,burst(col,el.h),1.7,800)}
  const hit=dmg?tg:[];if(hit.length&&u.cell&&hit[0].cell)orb(u,hit[0],col);sweep(u,sk,hit);
  const kind=sk.fx==='arrows'?'arrows':sk.fx==='wind'?'wind':ELFX[u.el];
  setTimeout(()=>{hit.forEach(t=>t.cell&&fxAt(t.cell,FXB[kind](),1.5,900));(sup||[]).forEach(t=>t.cell&&fxAt(t.cell,FXB.holy(),1.4,900))},(dmg?240:0)/BT.speed)}
};
function endBattle(win){
 const c=BT.ctx;$('#battle').style.display='none';const rw={gold:0,food:0,iron:0,exp:0,gem:0},notes=[];
 let nextOk=false;
 if(win){S.stat.wins++;bump('win');
  if(c.mode==='camp'){const first=c.s===S.prog[c.reg],b=stageReward(c.g,c.boss),f=first?1:.7;rw.gold=Math.round(b.gold*f);rw.food=Math.round(b.food*f);rw.iron=Math.round(b.iron*f);rw.exp=Math.round(b.exp*f);
   if(first){S.prog[c.reg]=c.s+1;rw.gem=c.boss?80:30;notes.push('🏁 Lần đầu vượt ải!');const jn=HJOIN[c.reg+':'+c.s];if(jn){if(S.heroes[jn]){S.heroes[jn].shards+=3;notes.push(`🎴 ${HM[jn].n} trùng: +3 mảnh`)}else{S.heroes[jn]=mkRec();notes.push(`🎴 ${HM[jn].n} gia nhập!`)}}
    if(c.s===9&&c.reg<2)notes.push(`🔓 Mở khóa thời đại ${REGIONS[c.reg+1].n}!`)}
   nextOk=c.s+1<10&&c.s+1<=S.prog[c.reg]}
  else if(c.mode==='tower'){if(c.f>S.tower){S.tower=c.f}const b=stageReward(Math.floor(c.f*1.2),c.boss);rw.gold=b.gold;rw.food=b.food;rw.iron=b.iron;rw.exp=b.exp;if(c.f%5===0)rw.gem=40}
  else if(c.mode==='hunt'){const b=stageReward(c.g,true);rw.gold=b.gold*2;rw.iron=b.iron*3;rw.exp=b.exp;rw.gem=25}
 }else if(!BT.quit){rw.exp=10}
 BT.quit=false;grant(rw);save();updTop();
 let h=`<div class="lvl ${win?'win':'lose'}">${win?'🏆 CHIẾN THẮNG':'☠️ THẤT BẠI'}</div><div style="text-align:center">${rtxt(rw)||'Không có phần thưởng'}</div>${notes.map(n=>`<div class="sm ok" style="text-align:center;margin-top:4px">${n}</div>`).join('')}${win?'':'<div class="sm" style="text-align:center;margin-top:6px">Gợi ý: nâng cấp tướng và trang bị, đổi vị trí đội hình, tận dụng khắc chế binh chủng.</div>'}`;
 h+=`<div class="row" style="margin-top:12px"><button class="btn gray grow" data-a="close">Đóng</button><button class="btn grow" id="again">Chiến lại</button>${win&&nextOk?'<button class="btn red grow" id="nextb">Màn kế</button>':''}</div>`;
 modal('res',h,true);render();
 $('#again').onclick=()=>{closeM();c.mode==='camp'?startCamp(c.reg,c.s):c.mode==='tower'?startTower():startHunt(c.bossId)};
 const nb=$('#nextb');if(nb)nb.onclick=()=>{closeM();startCamp(c.reg,c.s+1)};
 if(win&&S.auto&&nextOk&&c.mode==='camp'){setTimeout(()=>{if($('.modal[data-key="res"]')){closeM();startCamp(c.reg,c.s+1);setTimeout(()=>{if($('.modal[data-key="pre"]'))launch()},400)}},1500)}
}

/* ---------- khởi động / offline ---------- */
function tick(){
 if(!S||!$('#login').style.display||$('#login').style.display!=='none')return;
 const now=Date.now(),dt=(now-S.last)/1000;
 if(dt>30){offline(dt);return}
 const inc=income();S.res.gold+=inc.gold*dt;S.res.food+=inc.food*dt;S.res.iron+=inc.iron*dt;S.last=now;updRes();
}
let sv=0;setInterval(()=>{tick();if(++sv%10===0)save()},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else tick()});
window.addEventListener('beforeunload',save);
function offline(dt){
 const cap=Math.min(dt,12*3600),inc=income(),r={gold:Math.floor(inc.gold*cap*.6),food:Math.floor(inc.food*cap*.6),iron:Math.floor(inc.iron*cap*.6),exp:Math.floor(cap/60)};
 grant(r);S.last=Date.now();save();updTop();
 const hh=Math.floor(cap/3600),mm=Math.floor(cap%3600/60);
 modal('off',`<h2>⚔️ Quân đội ngoại tuyến</h2><div style="text-align:center">Trong ${hh} giờ ${mm} phút vắng mặt, quân sĩ vẫn tự chinh chiến và sản xuất:<div class="lvl win">${rtxt(r)}</div><div class="sm">Tối đa tích lũy 12 giờ · hiệu suất 60%</div></div><button class="btn" style="width:100%;margin-top:10px" data-a="close">Thu hoạch</button>`);
 render();
}
const STORY=`<h2>📜 Khởi nguồn Xích Quỷ</h2><div class="sm" style="font-size:13px;line-height:1.5">Thuở hồng hoang, đất Xích Quỷ còn phủ khói sương yêu khí. Từ biển Đông, Lạc Long Quân mang dòng giống rồng lên bờ; cùng Âu Cơ dòng tiên trên non cao dựng nên cõi Bách Việt.<br><br>Nay, ngươi là vị <b>minh chủ</b> của cả dòng chảy ngàn năm ấy: chiêu mộ anh hùng, dựng quân, giữ bờ cõi, từ huyền sử Xích Quỷ qua Văn Lang, Âu Lạc… tới những thời đại sau.<br><br><i>Lưu ý: phần Xích Quỷ là huyền sử – truyền thuyết; từ Âu Lạc trở đi bám theo tư liệu lịch sử.</i></div><button class="btn" style="width:100%;margin-top:10px" data-a="toera">Bắt đầu hành trình</button>`;
function showLogin(){
 const old=loadSave(),L=$('#login');L.style.display='flex';
 L.innerHTML=`<div class="spin">${drum(120)}</div><h1>ĐẠI VIỆT CHIẾN KÝ</h1><p>HÀO KHÍ NGÀN NĂM</p>${old?`<div class="sm" style="margin-bottom:8px">Đã có tiến trình: <b>${old.name}</b> · Lv.${old.acc.lv}</div><button class="btn" id="cont" style="width:80%;margin-bottom:8px">Tiếp tục</button>`:''}<input id="nm" maxlength="16" placeholder="Tên minh chủ" value="${old?'':''}"><button class="btn red" id="start" style="width:80%">${old?'Chơi mới (xóa dữ liệu cũ)':'Bắt đầu hành trình'}</button><div class="sm" style="margin-top:14px">Idle RPG · Chiến thuật · Thu thập danh tướng</div>`;
 const cont=$('#cont');if(cont)cont.onclick=()=>{S=old;enter(false)};
 $('#start').onclick=()=>{if(old&&!confirm('Xóa dữ liệu cũ và chơi mới?'))return;S=newSave(($('#nm').value||'Minh chủ').trim());enter(true)};
}
function enter(isNew){
 $('#login').style.display='none';rollover();
 const gap=(Date.now()-S.last)/1000;render();
 if(isNew){save();modal('story',STORY,true);S.intro=1}
 else{if(gap>60)offline(gap);else S.last=Date.now();}
 save();
}
showLogin();
</script>
